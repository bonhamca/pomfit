name: Deploy PomFit to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fetch real Pomeranian bark (CC0)
        shell: bash
        run: |
          set -e
          EMBED_URL='https://freesound.org/embed/sound/iframe/608732/simple/medium/'
          PAGE="$(curl -fsSL --retry 3 "$EMBED_URL")"
          BARK_URL="$(printf '%s' "$PAGE" | grep -oE 'https://cdn\.freesound\.org/previews/[0-9]+/[0-9]+_[0-9]+-(hq|lq)\.mp3' | head -n 1)"
          if [ -z "$BARK_URL" ]; then
            BARK_URL="$(printf '%s' "$PAGE" | grep -oE 'https://cdn\.freesound\.org/[^"''' <]+\.mp3' | head -n 1)"
          fi
          if [ -z "$BARK_URL" ]; then
            echo "Could not locate Pomeranian preview URL in Freesound embed page."
            exit 1
          fi
          echo "Using Freesound Pomeranian preview."
          curl -fsSL --retry 3 "$BARK_URL" -o pomeranian-bark.mp3
          test -s pomeranian-bark.mp3
          file pomeranian-bark.mp3
          ls -lh pomeranian-bark.mp3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
