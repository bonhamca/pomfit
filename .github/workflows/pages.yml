name: Deploy PomFit to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Bundle real dog bark
        shell: bash
        run: |
          set -e
          curl -fsSL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/4c/George_vuf_1996.ogg' -o bark-source.ogg
          test -s bark-source.ogg
          ffmpeg -hide_banner -loglevel error -y -i bark-source.ogg -codec:a libmp3lame -q:a 4 pomeranian-bark.mp3
          test -s pomeranian-bark.mp3
          rm -f bark-source.ogg
          ls -lh pomeranian-bark.mp3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
