<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refreshing PomFit</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;color:#20231f;display:grid;place-items:center;min-height:100vh;margin:0}.c{max-width:420px;padding:28px;text-align:center;background:white;border-radius:22px;box-shadow:0 8px 30px #0001}.p{font-size:42px}</style>
<div class="c"><div class="p">🐾</div><h2>Refreshing PomFit</h2><p>Clearing the old app cache. Your PomFit account and household data are not deleted.</p></div>
<script>
(async()=>{try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
}finally{setTimeout(()=>location.replace('./?fresh='+Date.now()),500);}})();
</script>
